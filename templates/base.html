<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

{% block title %}

FED-XAI V2

{% endblock %}

</title>

<!-- Bootstrap -->

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<!-- Bootstrap Icons -->

<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Google Fonts -->

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap"
rel="stylesheet">

<!-- Main CSS -->

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<!-- ==========================
NAVBAR
=========================== -->

<nav class="navbar navbar-expand-lg navbar-light shadow-sm bg-white">

<div class="container">

<a
class="navbar-brand fw-bold text-success"
href="/">

<i class="bi bi-cpu-fill"></i>

FED-XAI V2

</a>

<div class="d-flex gap-2">

<span class="badge rounded-pill bg-success">

ResNet50

</span>

<span class="badge rounded-pill bg-primary">

FedAvg

</span>

<span class="badge rounded-pill bg-dark">

LIME

</span>

</div>

</div>

</nav>

<!-- ==========================
PAGE CONTENT
=========================== -->

<main>

{% block content %}

{% endblock %}

</main>

<!-- ==========================
FOOTER
=========================== -->

<footer class="footer">

<div class="container">

<p>

<strong>FED-XAI V2</strong>

</p>

<p>

Federated Explainable Artificial Intelligence for Plant Disease Detection

</p>

<p>

Developed by

<strong>Okposio Great</strong>

and

<strong>Adegbola Victor</strong>

</p>

</div>

</footer>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Main JS -->

<script
src="{{ url_for('static', filename='js/app.js') }}">
</script>

</body>

</html>
